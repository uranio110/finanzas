name: Mantener Supabase activo

# El free tier de Supabase suspende proyectos tras 1 semana sin actividad
# y la restauración es manual (ver README). Este ping semanal evita que
# eso pase por simple abandono temporal del uso diario.
on:
  schedule:
    - cron: '0 12 * * 1' # todos los lunes a las 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ligero a la API REST de Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${VITE_SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
